apiVersion: v1
kind: Namespace
metadata:
  name: tradingai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingai-server
  namespace: tradingai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradingai
  template:
    metadata:
      labels:
        app: tradingai
    spec:
      containers:
        - name: api
          image: yourregistry/tradingai:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tradingai-secrets
                  key: GITHUB_TOKEN
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tradingai-hpa
  namespace: tradingai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradingai-server
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
